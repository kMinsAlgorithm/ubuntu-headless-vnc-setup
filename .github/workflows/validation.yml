name: Validate desktop tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_windows_tools.py -v
      - shell: powershell
        run: ./tests/test_windows_installer.ps1
      - shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $parseTokens = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: git diff --check
