# KMGcocel: RTX 5080 (PCI:1:0:0), HDMI-0 = NVIDIA DFP-0, LG ULTRAWIDE 3440x1440.
# - ConnectedMonitor + CustomEDID: keep HDMI-0 and the LG mode list when no cable is attached.
#   A different monitor on HDMI-0 is also treated as the LG; remove CustomEDID in that case.
# - AllowNonEdidModes: the stock driver rejected RandR --addmode 1600x1050 (BadMatch)
#   on 2026-09-23; the resolution selector needs these non-EDID iPad modes.
# Installed from ~/headless-vnc-setup/staging; backup in ~/headless-vnc-setup/backup-*.

Section "Monitor"
    Identifier "HDMI0Monitor"
    # CVT timings identical to resolution_switcher.py IPAD_MODELINES.
    Modeline "1600x1050" 114.00 1600 1648 1680 1760 1050 1053 1063 1080 +hsync -vsync
    Modeline "1184x824" 68.25 1184 1232 1264 1344 824 827 837 848 +hsync -vsync
EndSection

Section "Device"
    Identifier "NvidiaVirtualMonitor"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ConnectedMonitor" "DFP-0"
    Option "CustomEDID" "DFP-0:/etc/X11/edid/lg-ultrawide-dfp0.bin"
    Option "ModeValidation" "DFP-0: AllowNonEdidModes"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "NvidiaVirtualMonitor"
    Monitor "HDMI0Monitor"
    DefaultDepth 24
EndSection
