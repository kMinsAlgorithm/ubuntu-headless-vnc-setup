Section "Monitor"
    Identifier "HDMI0Adaptive"
    Modeline "3440x1440R" 319.75 3440 3488 3520 3600 1440 1443 1453 1481 +HSync -VSync
    Option "PreferredMode" "3440x1440R"
EndSection

Section "Device"
    Identifier "NvidiaVirtualMonitor"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ConnectedMonitor" "DFP-2"
    Option "UseDisplayDevice" "DFP-2"
    Option "MetaModes" "DFP-2: 3440x1440R +0+0, DFP-2: nvidia-auto-select +0+0, DFP-2: 1920x1080_60 +0+0"
    Option "ModeValidation" "NoMaxPClkCheck, NoEdidMaxPClkCheck, NoMaxSizeCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoDFPNativeResolutionCheck, NoVirtualSizeCheck"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "NvidiaVirtualMonitor"
    Monitor "HDMI0Adaptive"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 5120 2160
        Modes "3440x1440R" "3840x2160" "2560x1440" "1920x1080"
    EndSubSection
EndSection
